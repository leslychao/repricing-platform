function render(){closePopovers(false);if($('dialog[open]'))closeModal(true);document.title=`${pages[current]?.[0]||'Товары'} · repricer`;const root=$('#root');if(current==='landing')root.innerHTML=renderLanding();else if(current==='login')root.innerHTML=renderLogin();else if(current==='start')root.innerHTML=renderStart();else root.innerHTML=shell((renderers[current]||renderProducts)());if(searchValue&&$('#page-search'))filterTable(searchValue);$$('input#excluded-promotions').forEach(e=>e.removeAttribute('required'));document.body.dataset.screen=current;}
function go(route){if(!pages[route])return;if(dirty&&route!==current){pendingNavigation=route;confirmAction('Уйти без сохранения?','Несохранённые изменения формы будут потеряны.','Уйти без сохранения',()=>{dirty=false;pendingPhoto=undefined;go(pendingNavigation);});return;}if(signedOut&&!['landing','login'].includes(route))route='login';closePopovers(false);closeModal(true);if(location.hash==='#'+route){current=route;render();return;}location.hash=route;}
function applyHash(){let route=location.hash.slice(1);if(!pages[route])route='products';if(signedOut&&!['landing','login'].includes(route))route='login';if(dirty&&route!==current){history.replaceState(null,'','#'+current);go(route);return;}current=route;searchValue='';filterValue='';render();window.scrollTo(0,0);}
function toast(message){clearTimeout(toastTimer);const t=$('#toast');t.textContent=message;t.hidden=false;toastTimer=setTimeout(()=>t.hidden=true,4800);}
function saveForm(event,message,target){event.preventDefault();const f=event.target;if(!f.reportValidity())return;if(current==='policy'&&$('#policy-name'))policyNames[0]=$('#policy-name').value.trim();dirty=false;if(target)go(target);toast(message);}

function renderNotificationPopover(){const n=$('#notification-popover');let body=notifyTab==='notifications'?notifications.slice(0,3).map(x=>`<button class="pop-row ${x.read?'':'unread'}" onclick="readNotification(${x.id})">${icon(x.icon)}<span><p>${x.title}</p><small>${x.scope} · ${x.time}</small></span>${x.read?'':'<span class="dot"></span>'}</button>`).join(''):tasks.slice(0,3).map((x,i)=>`<button class="pop-row" onclick="taskScope='account';taskDrawer(${i})">${icon(x[3]===100?'check':'clock')}<span style="flex:1"><p>${x[0]}</p><small>${x[2]} · ${x[1]}</small>${x[3]!==null?`<div class="progress"><i style="width:${x[3]}%"></i></div>`:''}</span></button>`).join('');n.innerHTML=`<div class="pop-head"><h2 id="notifications-pop-title">Уведомления</h2>${iconBtn('x','Закрыть уведомления','closePopovers(true)')}</div><div class="tabs"><button class="tab ${notifyTab==='notifications'?'active':''}" onclick="notifyTab='notifications';renderNotificationPopover()" aria-pressed="${notifyTab==='notifications'}">Уведомления <span class="count">${notifications.filter(x=>!x.read).length}</span></button><button class="tab ${notifyTab==='tasks'?'active':''}" onclick="notifyTab='tasks';renderNotificationPopover()" aria-pressed="${notifyTab==='tasks'}">Задачи <span class="count">2</span></button></div>${body}<div class="pop-footer">${link(notifyTab==='notifications'?'notifications':'tasks',notifyTab==='notifications'?'Все уведомления':'Все задачи','arrow','link-btn')}</div>`;}

function matchesFilter(meta,route=current,filters=appliedFilters(route),query=searchValue){
 if(query&&!meta._text.includes(query.trim().toLowerCase()))return false;
 for(const f of schemaFor(route)){
  const v=filters[f.key];if(v===undefined)continue;const actual=meta[f.key];
  if(f.type==='multi'&&v.length&&!v.includes(String(actual??'')))return false;
  if(f.type==='text'&&v&&!String(actual??'').toLowerCase().includes(v.toLowerCase()))return false;
  if(['range','date'].includes(f.type)){
   if(actual===null||actual===undefined||actual==='')return false;
   if(v.min!==''&&v.min!==undefined&&actual<v.min)return false;
   if(v.max!==''&&v.max!==undefined&&actual>v.max)return false;
  }
 }
 return true;
}

function sparkline(values,tone='neutral'){if(!values||values.length<8)return '';const min=Math.min(...values),max=Math.max(...values),range=max-min||1,pts=values.map((v,i)=>`${2+i*73/(values.length-1)},${32-(v-min)*28/range}`).join(' ');const col=tone==='bad'?'#bb6947':tone==='good'?'#498876':'#7293ba';return `<div class="metric-spark"><svg viewBox="0 0 78 36" role="img" aria-label="Мини-график значений за выбранный период"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;}
metric=function(label,value,context,options={}){const def=metricDefinitions[label]||['chart',`Значение показателя «${label}» относится к выбранному объекту и периоду. ${plain(context||'')}. Отсутствие данных не заменяется нулём.`];const text=!/\d/.test(plain(value));return `<article class="metric ${options.accent?'accent':''} ${text?'text-value':''}"><div class="metric-top"><span class="metric-icon">${icon(options.icon||def[0])}</span><span class="label">${label}</span>${helpButton(label,[label,def[1],options.explanation||''])}</div><div class="metric-main"><strong>${value}</strong>${sparkline(options.values,options.tone)}</div><p class="metric-context">${context||'Для выбранной области'}</p>${options.delta!==undefined?`<div class="metric-bottom"><span class="delta ${options.tone||''}">${icon(Number(options.delta)>=0?'up':'down')}${Number(options.delta)>0?'+':''}${String(options.delta).replace('.',',')}${options.deltaUnit||'%'}</span><span>${options.comparison||'к сопоставимому периоду'}</span></div>`:options.quality?`<div class="metric-quality" aria-label="${esc(options.qualityLabel||'Полнота подтверждена')}">${[0,1,2,3].map(n=>`<i class="${n<options.quality?'ready':''}"></i>`).join('')}</div>`:`<div class="metric-bottom"><span>${options.footer||'Без сравнения периодов'}</span></div>`}</article>`;};

gridMarkup=function(rec){const v=tableView(rec.key),cols=orderedCols(rec),rows=matchingRows(rec),count=rows.length,max=Math.max(1,Math.ceil(count/v.size));v.page=Math.max(1,Math.min(v.page,max));const start=(v.page-1)*v.size,prs=rows.slice(start,start+v.size),width=cols.reduce((a,c)=>a+(v.widths[c.id]||c.width),0);const pin=rec.cls.includes('product-table')&&cols.find(c=>!c.selection)?.label==='Товар';

 return `<div class="table-scroll" tabindex="0" aria-label="Таблица: ${esc(pages[rec.route]?.[0]||'Данные')}"><table class="data-table ${rec.cls}" style="min-width:${width}px"><caption class="sr-only">${esc(pages[rec.route]?.[0]||'Данные')}</caption><colgroup>${cols.map(c=>`<col data-col="${c.id}" style="width:${v.widths[c.id]||c.width}px">`).join('')}</colgroup><thead><tr>${cols.map(c=>`<th scope="col" class="${classes(c)}" data-col="${c.id}" ${c.sort?`aria-sort="${v.sort===c.id&&v.direction?(v.direction===1?'ascending':'descending'):'none'}"`:''}${style(c)}><div class="th-inner">${c.selection?c.raw:c.action?'<span class="sr-only">Действия со строкой</span>':`<button type="button" class="column-grip-v5" data-col-drag="${c.id}" data-grid-drag="${rec.key}" aria-label="Переместить столбец: ${esc(c.label)}" title="Перетащите столбец. Стрелки клавиатуры меняют порядок." onpointerdown="startColumnDrag5(event,'${rec.key}','${c.id}')" onkeydown="columnDragKey5(event,'${rec.key}','${c.id}')">${icon('grip5')}</button>${c.sort?`<button type="button" class="th-sort" onclick="sortGrid('${rec.key}','${c.id}')" aria-label="Сортировать: ${esc(c.label)}"><span>${esc(c.label)}</span>${icon(v.sort===c.id&&v.direction?(v.direction===1?'up':'down'):'sort')}</button>`:`<span>${esc(c.label)}</span>`}${helpButton(c.label)}`}</div>${!c.selection&&!c.action?`<button type="button" class="column-resizer" role="separator" aria-label="Изменить ширину: ${esc(c.label)}" aria-orientation="vertical" aria-valuemin="${c.min}" aria-valuemax="700" aria-valuenow="${v.widths[c.id]||c.width}" data-grid-resize="${rec.key}" data-column="${c.id}"></button>`:''}</th>`).join('')}</tr></thead><tbody>${prs.map(r=>`<tr data-meta="${esc(JSON.stringify(r.meta))}" data-row="${r.index}" data-search="${esc(r.meta._text)}">${cols.map(c=>`<td class="${classes(c)}"${style(c)}>${r.cells[c.index]??''}</td>`).join('')}</tr>`).join('')||`<tr class="no-results"><td colspan="${cols.length}"><div class="empty compact">${icon('search')}<h2>Ничего не найдено</h2><p>Измените поиск или условия фильтра.</p>${rec.filterable?btn('Сбросить условия','resetFilters(true)'):''}</div></td></tr>`}</tbody></table></div><div class="table-footer"><span class="shown-count" aria-live="polite">${count?`${start+1}–${Math.min(start+v.size,count)} из ${count}`:'0 из 0'}</span><label class="page-size-label">На странице <select aria-label="Строк на странице" onchange="pageSizeGrid('${rec.key}',this.value)">${[5,10,25,50].map(n=>`<option value="${n}" ${n===v.size?'selected':''}>${n}</option>`).join('')}</select></label><div class="pager"><button type="button" class="icon-btn" ${v.page<=1?'disabled':''} aria-label="Предыдущая страница" onclick="pageGrid('${rec.key}',-1)">${icon('chevron-left')}</button><span class="page-count">${v.page} / ${max}</span><button type="button" class="icon-btn" ${v.page>=max?'disabled':''} aria-label="Следующая страница" onclick="pageGrid('${rec.key}',1)">${icon('chevron-right')}</button></div></div>`;};
